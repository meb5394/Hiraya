<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>...</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        #start {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 16px;
            z-index: 10;
        }
    </style>
</head>

<body>

    <video id="secretVideo" playsinline>
        <source src="elmer.mp4" type="video/mp4">
    </video>

    <div id="start">
        Tap to start the easter bunny eggpie video
    </div>

    <script>

        const video = document.getElementById("secretVideo");
        const start = document.getElementById("start");

        // Try autoplay
        video.play().catch(() => {

            // Autoplay was blocked
            start.style.display = "flex";

        });

        // Fallback if autoplay is blocked
        start.addEventListener("click", () => {

            start.style.display = "none";

            video.play();

        });

        // Return to Lesson 1 after the video finishes
        video.addEventListener("ended", () => {

            window.location.href = "lesson1.html";

        });

    </script>

</body>
</html>
